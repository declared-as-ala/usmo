  <!-- PSS Monogram -->
  <text x="50" y="46" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">PSS</text>
  <!-- Star -->
  <polygon points="50,52 53,60 61,60 55,65 57,73 50,68 43,73 45,65 39,60 47,60" fill="url(#pssGold)" stroke="#b8860b" stroke-width="0.5" />
  <!-- Foundation Year -->
  <text x="50" y="84" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">1965</text>
