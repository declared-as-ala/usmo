      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#002d72" />
    </linearGradient>
    <linearGradient id="pssGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>
  <!-- Shield Background -->
  <path d="M50 4 L88 18 C88 56 68 85 50 96 C32 85 12 56 12 18 Z" fill="url(#pssBlue)" stroke="#ffffff" stroke-width="3" />
