# =============================================================================
# USM Platform — Docker Compose (PRODUCTION)
# =============================================================================
#
# Only nginx publishes ports to the host (80/443). Every other service —
# mongo, minio, api, web — is reachable exclusively over the internal
# "usm-internal" Docker network. Nothing else is exposed on the VPS.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f api
#
# Requires a populated .env.production file next to this compose file
# (copy .env.production.example and fill in real values — never commit it).
# =============================================================================

services:

  # ── MongoDB (internal only) ───────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: usm-mongo
    restart: unless-stopped
    networks: [usm-internal]
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: usmo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (internal only — served publicly through nginx, see nginx.conf) ─
  minio:
    image: minio/minio:latest
    container_name: usm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks: [usm-internal]
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:?MINIO_ROOT_USER or MINIO_ACCESS_KEY is required}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:?MINIO_ROOT_PASSWORD or MINIO_SECRET_KEY is required}}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Client (one-shot bucket init) ───────────────────────────────────
  mc:
    image: minio/mc:latest
    container_name: usm-mc
    networks: [usm-internal]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:?MINIO_ROOT_USER or MINIO_ACCESS_KEY is required}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:?MINIO_ROOT_PASSWORD or MINIO_SECRET_KEY is required}}
      MINIO_BUCKET: ${MINIO_BUCKET:-usm-media}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing "local/$${MINIO_BUCKET}";
        mc anonymous set public "local/$${MINIO_BUCKET}";
        echo '[mc] Public media bucket is ready.';
        exit 0;
      "
    restart: "no"

  # ── NestJS API (internal only — reached via nginx at https://$API_DOMAIN) ─
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: usm-api:prod
    container_name: usm-api
    restart: unless-stopped
    networks: [usm-internal]
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/usmo}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Use a comma-separated list when more than one browser origin is valid.
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:?MINIO_ROOT_USER or MINIO_ACCESS_KEY is required}}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:?MINIO_ROOT_PASSWORD or MINIO_SECRET_KEY is required}}
      MINIO_BUCKET: ${MINIO_BUCKET:-usm-media}
      # Relative by default so internal MinIO names can never leak to browsers.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/usm-media}

  # ── Next.js Web (internal only — reached via nginx at https://$APP_DOMAIN) ─
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Same-origin is the safe fallback. A dedicated API domain remains
        # supported by setting NEXT_PUBLIC_API_URL explicitly on the VPS.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        API_DOMAIN: ${API_DOMAIN:-}
        MINIO_BUCKET: ${MINIO_BUCKET:-usm-media}
    image: usm-web:prod
    container_name: usm-web
    restart: unless-stopped
    networks: [usm-internal]
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      SITE_URL: ${SITE_URL:-http://localhost}
      INTERNAL_API_URL: http://api:3001/api

  # ── Nginx reverse proxy (only service exposed to the internet) ───────────
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: usm-nginx:prod
    container_name: usm-nginx
    restart: unless-stopped
    networks: [usm-internal]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - web
      - minio
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      # Safe even when domain variables are absent. The entrypoint accepts
      # hostnames separated only by spaces and falls back to "_".
      NGINX_SERVER_NAMES: ${NGINX_SERVER_NAMES:-_}
      NGINX_HTTPS_MODE: ${NGINX_HTTPS_MODE:-auto}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-350m}
      MINIO_BUCKET: ${MINIO_BUCKET:-usm-media}
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://127.0.0.1/nginx-health"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Certbot (Let's Encrypt) — run manually, not a long-lived daemon ──────
  #
  # Chicken-and-egg note: nginx's config unconditionally references
  # certificate files (see deploy/nginx/templates/default.conf.template), so
  # it CANNOT start at all until certs already exist — meaning you can't use
  # nginx to serve the HTTP-01 webroot challenge for the very first issuance.
  #
  # FIRST issuance — standalone mode, run BEFORE `docker compose up nginx`
  # (nothing else may be bound to port 80 at this point; run once per domain,
  # each becomes its own /etc/letsencrypt/live/<domain>/ lineage, matching the
  # separate ssl_certificate paths the two nginx server blocks expect):
  #   docker run --rm -p 80:80 \
  #     -v $(pwd)/deploy/certbot/conf:/etc/letsencrypt \
  #     -v $(pwd)/deploy/certbot/www:/var/www/certbot \
  #     certbot/certbot certonly --standalone \
  #     -d $APP_DOMAIN --email $LETSENCRYPT_EMAIL --agree-tos --no-eff-email
  #   docker run --rm -p 80:80 \
  #     -v $(pwd)/deploy/certbot/conf:/etc/letsencrypt \
  #     -v $(pwd)/deploy/certbot/www:/var/www/certbot \
  #     certbot/certbot certonly --standalone \
  #     -d $API_DOMAIN --email $LETSENCRYPT_EMAIL --agree-tos --no-eff-email
  #   docker compose -f docker-compose.prod.yml up -d nginx
  #
  # RENEWAL — webroot mode, safe once nginx is already running (nginx serves
  # /.well-known/acme-challenge/ from the shared ./deploy/certbot/www volume;
  # this is what scripts/setup-vps.sh's cron entry runs nightly):
  #   docker compose -f docker-compose.prod.yml run --rm certbot renew
  #   docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
  certbot:
    image: certbot/certbot:latest
    container_name: usm-certbot
    networks: [usm-internal]
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: "true" # no-op when brought up by `docker compose up`; invoked via `run` instead

networks:
  usm-internal:
    driver: bridge

volumes:
  mongo_data:
  minio_data:
