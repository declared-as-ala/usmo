name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  NODE_VERSION: "22"

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint:web
          npm run typecheck:web
          npm run typecheck:api

      - name: Tests
        run: npm test

      - name: Application builds
        env:
          NEXT_PUBLIC_API_URL: /api
        run: |
          npm run build:web
          npm run build:api

      - name: Validate production Compose
        env:
          JWT_SECRET: ci-only-placeholder-with-at-least-32-characters
          MINIO_ROOT_USER: ci-user
          MINIO_ROOT_PASSWORD: ci-only-placeholder-password
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production Docker images
        env:
          JWT_SECRET: ci-only-placeholder-with-at-least-32-characters
          MINIO_ROOT_USER: ci-user
          MINIO_ROOT_PASSWORD: ci-only-placeholder-password
        run: docker compose -f docker-compose.prod.yml build api web nginx

      - name: Validate safe Nginx fallback
        run: |
          docker run --rm --add-host api:127.0.0.1 --add-host web:127.0.0.1 --add-host minio:127.0.0.1 usm-nginx:prod nginx -t
          docker run --rm \
            --add-host api:127.0.0.1 --add-host web:127.0.0.1 --add-host minio:127.0.0.1 \
            -e 'NGINX_SERVER_NAMES=https://invalid.example, bad.example' \
            -e MINIO_BUCKET=usm-media \
            usm-nginx:prod nginx -t

  deploy:
    name: Deploy to VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Deploy and verify over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            DEPLOY_DIR='${{ secrets.VPS_DEPLOY_PATH }}'
            if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR=/var/www/usmo; fi

            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R "$USER":"$USER" "$DEPLOY_DIR"

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone --branch main https://github.com/declared-as-ala/usmo.git "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: tracked changes exist on the VPS; refusing to overwrite them."
              exit 1
            fi

            git fetch --prune origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            DEPLOY_SKIP_GIT_PULL=1 \
            DEPLOY_BRANCH=main \
            DEPLOY_PUBLIC_HOST='${{ secrets.VPS_HOST }}' \
              bash deploy/scripts/deploy.sh
